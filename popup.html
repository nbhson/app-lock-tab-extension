<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Lock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #fff;
    }
    .container {
      padding: 20px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .header-icon {
      font-size: 32px;
    }
    .header-text h1 {
      font-size: 20px;
      font-weight: 600;
    }
    .header-text p {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
    }
    .domain-info {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .domain-info .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(255,255,255,0.4);
      margin-bottom: 4px;
    }
    .domain-info .domain {
      font-size: 14px;
      font-family: monospace;
      word-break: break-all;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status-dot.locked {
      background: #e74c3c;
    }
    .status-dot.unlocked {
      background: #2ecc71;
    }
    .status-dot.no-password {
      background: #f39c12;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 6px;
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #e74c3c;
    }
    input::placeholder {
      color: rgba(255,255,255,0.3);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #e74c3c;
      color: #fff;
    }
    .btn-primary:hover {
      background: #c0392b;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.2);
    }
    .btn-danger {
      background: rgba(231, 76, 60, 0.2);
      color: #e74c3c;
      border: 1px solid rgba(231, 76, 60, 0.3);
    }
    .btn-danger:hover {
      background: rgba(231, 76, 60, 0.3);
    }
    .btn-success {
      background: #2ecc71;
      color: #fff;
    }
    .btn-success:hover {
      background: #27ae60;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hidden {
      display: none !important;
    }
    .footer {
      text-align: center;
      padding-top: 12px;
      margin-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 12px;
      color: rgba(255,255,255,0.3);
    }
    .footer a {
      color: rgba(255,255,255,0.4);
      text-decoration: none;
    }
    .footer a:hover {
      color: rgba(255,255,255,0.6);
    }
    .message {
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }
    .message.success {
      display: block;
      background: rgba(46, 204, 113, 0.15);
      border: 1px solid rgba(46, 204, 113, 0.3);
      color: #2ecc71;
    }
    .message.error {
      display: block;
      background: rgba(231, 76, 60, 0.15);
      border: 1px solid rgba(231, 76, 60, 0.3);
      color: #e74c3c;
    }
    .toggle-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-icon">🔒</div>
      <div class="header-text">
        <h1>Tab Lock</h1>
        <p id="current-domain-display">No domain detected</p>
      </div>
    </div>

    <div id="message" class="message"></div>

    <div id="no-tab" class="domain-info">
      <p style="text-align:center;color:rgba(255,255,255,0.5);font-size:14px;">
        Open a tab to manage its lock settings
      </p>
    </div>

    <div id="main-content">
      <div class="domain-info">
        <div class="label">Current Domain</div>
        <div class="domain" id="domain-text">-</div>
        <div class="status">
          <div class="status-dot" id="status-dot"></div>
          <span id="status-text" style="font-size:13px;">Checking...</span>
        </div>
      </div>

      <!-- No password set yet -->
      <div id="section-set-password">
        <div class="form-group">
          <label>Set a password for this domain</label>
          <input type="password" id="new-password" placeholder="Enter new password" />
        </div>
        <div class="form-group">
          <input type="password" id="confirm-password" placeholder="Confirm password" />
        </div>
        <button class="btn btn-primary" id="btn-set-password">🔐 Set Password & Lock</button>
      </div>

      <!-- Password is set -->
      <div id="section-manage-password" class="hidden">
        <div class="form-group">
          <label>Enter password to unlock this domain for this session</label>
          <input type="password" id="unlock-password" placeholder="Enter password" />
        </div>
        <div class="actions">
          <button class="btn btn-success" id="btn-unlock">🔓 Unlock for this session</button>
          <button class="btn btn-danger" id="btn-remove-password">🗑️ Remove password for this domain</button>
        </div>
      </div>

      <div class="toggle-section">
        <div class="form-group">
          <label>Current Password (to change)</label>
          <input type="password" id="change-current-password" placeholder="Current password" />
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="change-new-password" placeholder="New password" />
        </div>
        <div class="form-group">
          <input type="password" id="change-confirm-password" placeholder="Confirm new password" />
        </div>
        <button class="btn btn-secondary" id="btn-change-password">🔄 Change Password</button>
      </div>
    </div>

    <div class="footer">
      <a href="#" id="open-options">⚙️ Manage all domains</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
